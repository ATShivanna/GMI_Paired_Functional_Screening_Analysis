    <text x="85" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102A43">ΔMin / ΔAUC</text>
    <text x="85" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#102A43">metrics</text>
